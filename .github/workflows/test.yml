name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        # A throwaway home, so no test touches the runner's real config. It must sit outside the temp dir:
        # that is a crew write root, and the guard tests check that writes to ~ are blocked.
        run: |
          export HOME="$(dirname "$GITHUB_WORKSPACE")/ci-home" SHOPFLOOR_HOME="$(dirname "$GITHUB_WORKSPACE")/ci-shopfloor"
          mkdir -p "$HOME"
          git config --global user.name ci
          git config --global user.email ci@example.org
          # if a test hangs, dump every thread's stack before the job times out
          ( sleep 480; pkill -ABRT -f "unittest -v" ) &
          python -X faulthandler -m unittest -v
